# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: https://flakehub.com/f/NixOS/nixpkgs/0.1.*.tar.gz
  nixvim:
    url: github:nix-community/nixvim
allow_unfree: true
